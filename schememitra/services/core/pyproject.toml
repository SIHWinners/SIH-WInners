[project]
name = "schememitra-core"
version = "0.1.0"
description = "SchemeMitra core service: eligibility, finance, routing, documents, voice, applications"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "qrcode[pil]>=7.4",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "rapidfuzz>=3.9",
  "indic-transliteration>=2.3",
  "xgboost>=2.1",
  "fpdf2>=2.8",
  "uharfbuzz>=0.39",
  "python-multipart>=0.0.9",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "pip-audit>=2.7",
  "asgi-lifespan>=2.1",
  "pypdf>=5.0",
]
ocr = ["rapidocr-onnxruntime>=1.3"]
asr = ["faster-whisper>=1.0"]
queue = ["arq>=0.26"]
s3 = ["boto3>=1.35"]
it = ["testcontainers[postgres,redis]>=4.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: needs Postgres/Redis via testcontainers (skipped without Docker)",
  "slow: long-running (ML training, 1k golden cases)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "E501"]  # line length is a review concern, not a lint gate

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ASYNC221"]
"alembic/versions/*" = ["E501"]  # autogenerated
"app/seed/*" = ["ASYNC240"]  # one-off seeding writes files synchronously on purpose
"app/modules/eligibility/kinds.py" = ["S106"]  # "pass_key" is a message key, not a password
"ml/*" = ["S301"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["alembic/", "ml/"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/*"]
