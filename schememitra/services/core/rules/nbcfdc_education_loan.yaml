name:
  en: NBCFDC Education Loan
  hi: NBCFDC शिक्षा ऋण
  bn: NBCFDC শিক্ষা ঋণ
  mr: NBCFDC शैक्षणिक कर्ज
  te: NBCFDC విద్యా రుణం
  ta: NBCFDC கல்விக் கடன்
  gu: NBCFDC શિક્ષણ લોન
  ur: NBCFDC تعلیمی قرض
