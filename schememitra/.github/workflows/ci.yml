name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.20.0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  core:
    name: core (python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/core } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: '3.12' }
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - name: unit + API tests (LIGHT_MODE, sandbox adapters)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
        env: { LIGHT_MODE: '1' }
      - name: rule engine must stay at 100% coverage
        run: uv run pytest tests/test_rules_engine.py --cov=app.modules.eligibility.engine --cov-fail-under=100 -q
      - name: ranking model trains reproducibly
        run: uv run python -m ml.train --rows 5000 --check
      - name: pip-audit
        run: uv run pip-audit --strict || true

  js:
    name: web, gateway, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node packages/i18n/scripts/check-keys.mjs
      - run: node packages/ui/scripts/check-contrast.mjs
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - name: build web + enforce bundle budgets
        run: pnpm --filter @sm/web build && node apps/web/scripts/check-budgets.mjs
      - name: npm audit (high+)
        run: pnpm audit --audit-level high || true

  e2e:
    name: e2e (playwright + axe)
    runs-on: ubuntu-latest
    needs: [core, js]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && (cd services/core && uv sync --extra dev)
      - run: pnpm --filter @sm/e2e exec playwright install --with-deps chromium
      - run: cp .env.example .env && node scripts/make.mjs seed
      - name: start stack
        run: node scripts/make.mjs demo > stack.log 2>&1 &
      - run: npx wait-on -t 240000 http://localhost:3000 http://localhost:8080/readyz
      - run: pnpm --filter @sm/e2e test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: 'apps/e2e/playwright-report' }

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: returntocorp/semgrep-action@v1
        with: { config: 'p/owasp-top-ten p/python p/typescript' }
