# Production-shaped profile (ADR-001): Postgres 16 + PostGIS, Redis 7, MinIO, core, ARQ worker,
# gateway, web. `docker compose -f infra/docker-compose.yml up --build` from the repo root.
# Optional: `--profile ai` adds Ollama; `-f infra/compose.observability.yml` adds Prometheus/Grafana.
name: schememitra

x-core-env: &core-env
  ENV: prod
  DEMO_MODE: ${DEMO_MODE:-true}
  DATABASE_URL: postgresql+asyncpg://schememitra:schememitra@postgres:5432/schememitra
  REDIS_URL: redis://redis:6379/0
  STORAGE_MODE: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: schememitra
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-schememitra}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-schememitra-secret}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-0123456789abcdef}
  DATA_KEK_B64: ${DATA_KEK_B64:-ZGV2LWtleS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=}
  HASH_SALT: ${HASH_SALT:-dev-salt-rotate-in-prod}
  INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-dev-internal-secret-change-me}
  GATEWAY_INTERNAL_URL: http://gateway:8080
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  CORS_ORIGINS: '["http://localhost:3000"]'
  BHASHINI_MODE: ${BHASHINI_MODE:-sandbox}
  BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
  BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
  DIGILOCKER_MODE: ${DIGILOCKER_MODE:-sandbox}
  SMS_MODE: ${SMS_MODE:-console}
  LLM_MODE: ${LLM_MODE:-off}
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
  OCR_MODE: ${OCR_MODE:-sandbox}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: schememitra
      POSTGRES_PASSWORD: schememitra
      POSTGRES_DB: schememitra
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schememitra"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schememitra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schememitra-secret}
    volumes:
      - miniodata:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-schememitra} $${MINIO_ROOT_PASSWORD:-schememitra-secret}
      && mc mb --ignore-existing local/schememitra && mc encrypt set sse-s3 local/schememitra || true"

  core:
    build: { context: .., dockerfile: services/core/Dockerfile }
    environment: *core-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"
    ports: ["8000:8000"]
    volumes:
      - corevar:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      retries: 30

  worker:
    build: { context: .., dockerfile: services/core/Dockerfile }
    environment: *core-env
    depends_on:
      core: { condition: service_healthy }
    command: ["arq", "app.worker.WorkerSettings"]
    volumes:
      - corevar:/app/var

  gateway:
    build: { context: .., dockerfile: apps/gateway/Dockerfile }
    environment:
      CORE_URL: http://core:8000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-0123456789abcdef}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-dev-internal-secret-change-me}
      CORS_ORIGINS_CSV: http://localhost:3000
      ENV: prod
    depends_on:
      core: { condition: service_healthy }
    ports: ["8080:8080"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    environment:
      GATEWAY_URL: http://gateway:8080
      INSECURE_COOKIES: "1"
    depends_on: [gateway]
    ports: ["3000:3000"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    ports: ["11434:11434"]

volumes:
  pgdata:
  miniodata:
  corevar:
  ollama:
